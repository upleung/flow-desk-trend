name: Refresh Loop

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run one cycle now bypassing the market-hours guard"
        type: boolean
        default: false

  schedule:
    #- cron: "20 13 * * 1-5"
    #- cron: "20 14 * * 1-5"

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name "flow-desk-bot"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Prepare OUT_DIR (data branch)
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OUT_DIR="${GITHUB_WORKSPACE}/_data-branch"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Clone repo
          git clone "$REMOTE_URL" "$OUT_DIR"

          cd "$OUT_DIR"

          # Ensure identity BEFORE any commit
          git config user.name "flow-desk-bot"
          git config user.email "actions@users.noreply.github.com"

          # Check if data branch exists
          if git ls-remote --exit-code --heads "$REMOTE_URL" data >/dev/null 2>&1; then
            echo "data branch exists — checking out"
            git checkout data
          else
            echo "data branch does not exist — creating orphan branch"
            git checkout --orphan data
            git rm -rf .
            git commit --allow-empty -m "Initialize data branch"
            git push "$REMOTE_URL" data
          fi

          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Run the refresh loop
        id: loop
        env:
          OUT_DIR: ${{ env.OUT_DIR }}
          LOOP_SLEEP_SEC: 3600
          FORCE_ONE_CYCLE: ${{ inputs.force && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 fetcher/loop.py 2>&1 | tee loop_output.log

          if grep -q "^REDISPATCH" loop_output.log; then
            echo "redispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "redispatch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-dispatch if needed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDISPATCH: ${{ steps.loop.outputs.redispatch }}
          IS_FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          if [ "$REDISPATCH" = "true" ] && [ "$IS_FORCE" != "true" ]; then
            echo "Re-dispatching refresh-loop.yml"
            gh workflow run refresh-loop.yml --repo "${{ github.repository }}"
          else
            echo "No redispatch needed"
          fi
