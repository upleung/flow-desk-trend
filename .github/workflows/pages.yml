name: Deploy Pages

# Publishes the static site (just index.html) to GitHub Pages at
# https://zlanghamer1.github.io/flow-desk/. The page itself fetches
# data.json live from the `data` branch's raw content at runtime, so this
# workflow only ever needs to ship index.html — nothing from fetcher/ or
# .github/ should end up in the deployed site.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
