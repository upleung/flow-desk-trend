name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/pages.yml

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Sync index.html to gh-pages
        run: |
          set -euo pipefail

          git config user.name "flow-desk-bot"
          git config user.email "actions@users.noreply.github.com"

          # 检查 gh-pages 是否存在
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages exists — fetching"
            git fetch origin gh-pages
            git checkout gh-pages
          else
            echo "gh-pages does not exist — creating orphan branch"
            git checkout --orphan gh-pages
            git rm -rf .
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize gh-pages branch"
            git push origin gh-pages
          fi

          # 从 main 复制 index.html
          git checkout main -- index.html
          touch .nojekyll
          git add index.html .nojekyll

          if git diff --cached --quiet; then
            echo "Site unchanged — nothing to publish."
          else
            git commit -m "Publish index.html from main (${GITHUB_SHA})"
            git push origin gh-pages
          fi
